<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLOHA GO - CALENDARIO</title>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef2f7;
    padding:20px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

#calendar{
    background:white;
    padding:15px;
    border-radius:12px;
}

/* 🔥 ASEGURA COLORES VISIBLES */
.fc-event {
    color: white !important;
    font-weight: bold;
    border: none !important;
    padding: 2px;
}
</style>

</head>

<body>

<h2>YOLOHA GO - CALENDARIO OPERATIVO</h2>

<div id="calendar"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {

        initialView: 'dayGridMonth',
        locale: 'es',

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },

        events: function(fetchInfo, successCallback, failureCallback) {

            fetch('./events.json')
                .then(r => r.json())
                .then(data => {

                    const eventos = data.map(item => {

                        // 🔥 LIMPIEZA SERVICIO
                        let servicio = (item.servicio || '')
                            .toString()
                            .toUpperCase()
                            .replace(/\|/g, '')
                            .trim();

                        let color = "#6c757d"; // default gris

                        // 🎨 REGLAS DE COLORES
                        if (servicio.includes("REFRIGERIO")) color = "#0d6efd";
                        else if (servicio.includes("ALMUERZO")) color = "#198754";
                        else if (servicio.includes("CENA")) color = "#6f42c1";
                        else if (servicio.includes("PASABOCAS")) color = "#fd7e14";
                        else if (servicio.includes("DESAYUNO")) color = "#20c997";
                        else if (servicio.includes("TARDE JUEGOS")) color = "#ffc107";

                        // 🔴 PRIORIDAD POR PAX
                        let pack = parseInt(item.pack || 0);
                        if (pack >= 100) color = "#dc3545";

                        return {
                            title: (item.cliente || '') + " - " + servicio,
                            start: item.date,

                            backgroundColor: color,
                            borderColor: color,

                            extendedProps: item
                        };
                    });

                    successCallback(eventos);
                })
                .catch(err => {
                    console.log("ERROR JSON:", err);
                    failureCallback(err);
                });

        },

        eventClick: function(info) {
            const e = info.event.extendedProps;

            alert(
                "CLIENTE: " + e.cliente + "\n" +
                "SERVICIO: " + e.servicio + "\n" +
                "LUGAR: " + e.lugar + "\n" +
                "PAX: " + e.pack + "\n" +
                "HORA: " + e.hora + "\n\n" +
                "DESCRIPCIÓN: " + e.descripcion
            );
        }

    });

    calendar.render();

});
</script>

</body>
</html>
