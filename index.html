<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario YOLOHA</title>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<style>
body{font-family:Arial;margin:0;padding:20px;background:#f3f4f6;}
#calendar{background:white;padding:15px;border-radius:10px;}
</style>
</head>

<body>

<h2>Calendario YOLOHA</h2>
<div id="calendar"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {

    initialView: 'dayGridMonth',

    events: function(info, successCallback, failureCallback) {

      fetch('./events.json')
        .then(r => r.json())
        .then(data => {

          let eventos = data.map(e => ({
            title: e.cliente + " - " + e.servicio,
            start: e.date
          }));

          successCallback(eventos);

        })
        .catch(err => {
          console.log(err);
          failureCallback(err);
        });

    }

  });

  calendar.render();

});
</script>

</body>
</html>
