<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLOHA GO - CALENDARIO</title>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef2f7;
    padding:20px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

#calendar{
    background:white;
    padding:15px;
    border-radius:12px;
}

/* eventos legibles */
.fc-event {
    color: white !important;
    font-weight: bold;
    border: none !important;
}
</style>

</head>

<body>

<h2>YOLOHA GO - CALENDARIO OPERATIVO</h2>

<div id="calendar"></div>

<!-- MODAL SIMPLE Y ESTABLE -->
<div class="modal fade" id="modalEvento" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Detalle del Evento</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="contenidoEvento" style="white-space:pre-line;"></div>

    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {

        initialView: 'dayGridMonth',
        locale: 'es',

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },

        events: function(fetchInfo, successCallback, failureCallback) {

            fetch('./events.json')
                .then(r => r.json())
                .then(data => {

                    const eventos = data.map(e => {

                        let servicio = (e.servicio || "")
                            .toUpperCase()
                            .replace(/\|/g, "")
                            .trim();

                        let color = "#6c757d";

                        if (servicio.includes("REFRIGERIO")) color = "#0d6efd";
                        else if (servicio.includes("ALMUERZO")) color = "#198754";
                        else if (servicio.includes("CENA")) color = "#6f42c1";
                        else if (servicio.includes("PASABOCAS")) color = "#fd7e14";
                        else if (servicio.includes("DESAYUNO")) color = "#20c997";
                        else if (servicio.includes("TARDE")) color = "#ffc107";

                        let pack = parseInt(e.pack || 0);
                        if (pack >= 100) color = "#dc3545";

                        return {
                            title: `${e.cliente} - ${servicio}`,
                            start: e.date,
                            backgroundColor: color,
                            borderColor: color,
                            extendedProps: e
                        };
                    });

                    successCallback(eventos);
                })
                .catch(err => {
                    console.log("ERROR JSON", err);
                    failureCallback(err);
                });
        },

        eventClick: function(info) {

            const e = info.event.extendedProps;

            // descripción vertical REAL
            let descripcion = (e.descripcion || "")
                .split("|")
                .map(x => x.trim())
                .filter(Boolean)
                .join("\n");

            // hora (si viene decimal)
            let hora = e.hora || "";

            let texto =
`CLIENTE: ${e.cliente}
SERVICIO: ${e.servicio}
LUGAR: ${e.lugar}
PAX: ${e.pack}
HORA: ${hora}

DESCRIPCIÓN:
${descripcion}

OBSERVACIONES:
${e.observaciones || ""}`;

            document.getElementById("contenidoEvento").innerText = texto;

            new bootstrap.Modal(document.getElementById('modalEvento')).show();
        }

    });

    calendar.render();

});
</script>

</body>
</html>
