<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLOHA GO - CALENDARIO</title>

<!-- FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#eef2f7;
}

.topbar{
    background:#111827;
    color:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

#calendar{
    background:white;
    padding:15px;
    border-radius:15px;
}
</style>

</head>

<body>

<div class="topbar">
    <h2>YOLOHA GO - CALENDARIO OPERATIVO</h2>
</div>

<div id="calendar"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {

        initialView: 'dayGridMonth',
        locale: 'es',
        height: 'auto',

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },

        // ✅ CARGA CORRECTA DEL JSON
        events: function(fetchInfo, successCallback, failureCallback) {

            fetch('./events.json')
                .then(response => response.json())
                .then(data => {

                    console.log("JSON CARGADO:", data);

                    let eventos = [];

                    for (let i = 0; i < data.length; i++) {

                        eventos.push({
                            title: (data[i].cliente || "Sin cliente") + " - " + (data[i].servicio || ""),
                            start: data[i].date,
                            extendedProps: data[i]
                        });

                    }

                    console.log("EVENTOS PROCESADOS:", eventos);

                    successCallback(eventos);

                })
                .catch(error => {
                    console.log("ERROR JSON:", error);
                    failureCallback(error);
                });

        },

        // 👇 CLICK EN EVENTO
        eventClick: function(info) {

            let e = info.event.extendedProps;

            alert(
                "CLIENTE: " + e.cliente + "\n" +
                "SERVICIO: " + e.servicio + "\n" +
                "LUGAR: " + e.lugar + "\n" +
                "PAX: " + e.pack + "\n" +
                "HORA: " + e.hora + "\n\n" +
                "DESCRIPCIÓN: " + e.descripcion
            );
        }

    });

    calendar.render();

});
</script>

</body>
</html>
