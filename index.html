<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLOHA CALENDARIO</title>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef2f7;
    padding:20px;
}

#calendar{
    background:white;
    padding:15px;
    border-radius:12px;
}
</style>

</head>

<body>

<h2>YOLOHA GO - CALENDARIO OPERATIVO</h2>

<div id="calendar"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {

        initialView: 'dayGridMonth',
        locale: 'es',

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth'
        },

        events: function(fetchInfo, successCallback, failureCallback) {

            fetch('./events.json')
                .then(r => r.json())
                .then(data => {

                    const eventos = data.map(e => ({
                        title: (e.cliente || '') + " - " + (e.servicio || ''),
                        start: e.date
                    }));

                    successCallback(eventos);

                })
                .catch(err => {
                    console.log("ERROR JSON:", err);
                    failureCallback(err);
                });

        }

    });

    calendar.render();

});
</script>

</body>
</html>
