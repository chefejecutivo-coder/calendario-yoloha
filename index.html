<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TEST CALENDARIO</title>

<!-- FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<!-- Bootstrap (para el modal) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<style>
#calendar {
  max-width: 900px;
  margin: 40px auto;
}

h2{
  text-align:center;
}
</style>

</head>

<body>

<h2>PRUEBA CALENDARIO</h2>

<div id="calendar"></div>

<!-- MODAL -->
<div class="modal fade" id="eventoModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Detalle del Evento</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="modalBody"></div>

    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var calendarEl = document.getElementById('calendar');

  var calendar = new FullCalendar.Calendar(calendarEl, {

    initialView: 'dayGridMonth',

    locale: 'es',

    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth'
    },

    events: [
      {
        title: 'EVENTO PRUEBA',
        start: '2026-05-28',
        extendedProps: {
          cliente: 'Cliente demo',
          servicio: 'Servicio demo',
          lugar: 'Lugar demo',
          hora: '12:00',
          descripcion: 'Este es un evento de prueba'
        }
      }
    ],

    // 👇 CLICK DEL EVENTO (AQUÍ ESTABA TU PROBLEMA)
    eventClick: function(info) {

      let e = info.event.extendedProps;

      let html = `
        <div>
          <h4>${info.event.title}</h4>

          <p><b>Cliente:</b> ${e.cliente}</p>
          <p><b>Servicio:</b> ${e.servicio}</p>
          <p><b>Lugar:</b> ${e.lugar}</p>
          <p><b>Hora:</b> ${e.hora}</p>

          <hr>

          <p><b>Descripción:</b><br>${e.descripcion}</p>
        </div>
      `;

      document.getElementById('modalBody').innerHTML = html;

      let modal = new bootstrap.Modal(document.getElementById('eventoModal'));
      modal.show();
    }

  });

  calendar.render();

});
</script>

</body>
</html>
